<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CommsControl - ระบบจัดการวิทยุสื่อสาร</title>
    
    <meta name="theme-color" content="#0f1524">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Light Theme Overrides (Default is Dark) */
        body.light-theme {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-theme .bg-panel { background-color: #ffffff; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        body.light-theme .text-primary { color: #0f172a; }
        body.light-theme .text-secondary { color: #64748b; }
        body.light-theme .input-field { background-color: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        body.light-theme .hover-item:hover { background-color: #f1f5f9; }
        
        /* Default Dark Theme Classes */
        body { background-color: #060913; color: #f1f5f9; }
        .bg-panel { background-color: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); backdrop-filter: blur(16px); }
        .text-primary { color: #ffffff; }
        .text-secondary { color: #94a3b8; }
        .input-field { background-color: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: #ffffff; }
        .hover-item:hover { background-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="font-sans transition-colors duration-500 overflow-hidden" id="body-tag">
    
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-600/20 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[30%] h-[40%] rounded-full bg-purple-600/20 blur-[120px] pointer-events-none z-0"></div>

    <div class="min-h-screen flex flex-col md:flex-row relative z-10">
        
        <div class="md:hidden px-5 py-4 flex justify-between items-center sticky top-0 z-40 bg-panel border-b">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-lg text-white">
                    <i data-lucide="radio" class="w-5 h-5"></i>
                </div>
                <span class="font-black text-xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">Comms.</span>
            </div>
            <button onclick="app.toggleMobileMenu()" class="p-2 rounded-lg text-secondary">
                <i data-lucide="menu" id="mobile-menu-icon"></i>
            </button>
        </div>

        <aside id="sidebar" class="fixed md:relative top-0 left-0 z-30 h-screen md:h-[calc(100vh-1.5rem)] md:m-3 w-64 flex-shrink-0 flex flex-col rounded-none md:rounded-3xl transform -translate-x-full md:translate-x-0 transition-all duration-300 ease-out shadow-2xl bg-panel border">
            <div class="p-6 hidden md:flex items-center space-x-3">
                <div class="p-2.5 bg-gradient-to-tr from-indigo-500 via-purple-500 to-indigo-500 bg-[length:200%_auto] rounded-xl shadow-lg text-white">
                    <i data-lucide="radio" class="w-6 h-6"></i>
                </div>
                <span class="font-black text-2xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">Comms.</span>
            </div>
            
            <nav class="px-3 py-2 space-y-1 flex-1 mt-6 md:mt-0 overflow-y-auto hide-scroll" id="nav-container">
                </nav>

            <div class="p-3 border-t border-slate-500/20 space-y-1" id="nav-footer">
                </div>
        </aside>

        <main class="flex-1 p-5 md:p-8 w-full h-screen overflow-y-auto scroll-smooth relative z-10">
            
            <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 fade-in">
                <div>
                    <h1 id="page-title" class="text-3xl md:text-4xl font-black tracking-tight mb-1 text-primary">Overview</h1>
                    <p id="page-subtitle" class="text-sm md:text-base font-medium text-secondary">กำลังเตรียมระบบ...</p>
                </div>
                
                <div class="flex items-center space-x-3">
                    <button onclick="app.fetchData()" class="p-2 rounded-xl bg-panel border transition hover-item" title="รีเฟรชข้อมูล">
                        <i data-lucide="refresh-cw" class="w-5 h-5 text-secondary"></i>
                    </button>
                    <div class="px-4 py-2 rounded-xl bg-panel border flex items-center space-x-2 cursor-pointer" onclick="app.switchView('settings')" title="คลิกเพื่อตั้งค่าการเชื่อมต่อ">
                        <div class="w-2.5 h-2.5 rounded-full bg-slate-500" id="status-dot"></div>
                        <span class="text-sm font-bold text-secondary" id="status-text">รอการเชื่อมต่อ</span>
                    </div>
                </div>
            </header>

            <div id="view-container" class="pb-20"></div>

        </main>
    </div>

    <script>
        // ==========================================
        // 1. STATE & DATA
        // ==========================================
        const state = {
            currentView: 'dashboard',
            isMobileMenuOpen: false,
            theme: localStorage.getItem('comms_theme') || 'dark',
            gasUrl: localStorage.getItem('comms_gas_url') || '',
            
            devices: [],
            employees: [],
            transactions: [],
            
            transForm: { type: 'borrow', selectedDevices: [] }
        };

        // ข้อมูลจำลองกรณีไม่มีฐานข้อมูล
        const fallbackDevices = [
            { id: 'R-001', model: 'Motorola CP200d', serial: 'S/N-9901', status: 'available' },
            { id: 'R-002', model: 'Motorola CP200d', serial: 'S/N-9902', status: 'borrowed', assignedTo: 'EMP-001' },
            { id: 'R-003', model: 'Icom IC-V80', serial: 'S/N-8801', status: 'maintenance' }
        ];

        const navItems = [
            { id: 'dashboard', icon: 'layout-dashboard', label: 'ภาพรวมระบบ' },
            { id: 'transactions', icon: 'arrow-right-left', label: 'เบิก-คืน อุปกรณ์' },
            { id: 'devices', icon: 'radio', label: 'คลังอุปกรณ์' },
            { id: 'employees', icon: 'users', label: 'บุคลากร' },
            { id: 'reports', icon: 'file-bar-chart', label: 'รายงาน' }
        ];

        // ==========================================
        // 2. CORE APP LOGIC
        // ==========================================
        const app = {
            init: function() {
                this.applyTheme();
                this.renderNavigation();
                
                if (state.gasUrl) {
                    this.fetchData();
                } else {
                    // Load fallback data
                    state.devices = fallbackDevices;
                    this.updateStatus('Local Mode', 'amber');
                    this.switchView('dashboard');
                }
            },

            applyTheme: function() {
                const body = document.getElementById('body-tag');
                if (state.theme === 'light') {
                    body.classList.add('light-theme');
                } else {
                    body.classList.remove('light-theme');
                }
                this.renderNavigation(); // Re-render to update icon
            },

            toggleTheme: function() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('comms_theme', state.theme);
                this.applyTheme();
            },

            saveSettings: function(event) {
                event.preventDefault();
                const url = document.getElementById('setting-url').value;
                state.gasUrl = url;
                localStorage.setItem('comms_gas_url', url);
                alert('บันทึกการตั้งค่าแล้ว ระบบจะทำการโหลดข้อมูลใหม่');
                this.fetchData();
            },

            fetchData: async function() {
                if (!state.gasUrl) return;
                this.updateStatus('Syncing...', 'spin');
                try {
                    const response = await fetch(state.gasUrl);
                    const data = await response.json();
                    if (data.devices) state.devices = data.devices;
                    if (data.employees) state.employees = data.employees;
                    if (data.transactions) state.transactions = data.transactions;
                    this.updateStatus('Online', 'emerald');
                } catch (error) {
                    console.error("Fetch Error:", error);
                    this.updateStatus('Error', 'rose');
                } finally {
                    if(state.currentView !== 'settings') this.renderCurrentView();
                }
            },

            syncData: async function(payload) {
                if (!state.gasUrl) return;
                this.updateStatus('Syncing...', 'spin');
                try {
                    await fetch(state.gasUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    this.updateStatus('Online', 'emerald');
                } catch (error) {
                    console.error("Sync Error:", error);
                    this.updateStatus('Error', 'rose');
                }
            },

            updateStatus: function(text, color) {
                const dot = document.getElementById('status-dot');
                document.getElementById('status-text').innerText = text;
                
                if (color === 'spin') {
                    dot.className = 'w-3 h-3 rounded-full border-2 border-indigo-400 border-t-transparent animate-spin bg-transparent';
                } else {
                    dot.className = `w-2.5 h-2.5 rounded-full bg-${color}-500 ${color==='emerald' ? 'animate-pulse' : ''}`;
                }
            },

            toggleMobileMenu: function() {
                state.isMobileMenuOpen = !state.isMobileMenuOpen;
                const sidebar = document.getElementById('sidebar');
                if(state.isMobileMenuOpen) sidebar.classList.remove('-translate-x-full');
                else sidebar.classList.add('-translate-x-full');
            },

            switchView: function(viewId) {
                state.currentView = viewId;
                this.renderNavigation();
                
                const titles = {
                    'dashboard': { title: 'Welcome back', sub: 'ภาพรวมระบบและการใช้งานวันนี้' },
                    'transactions': { title: 'Borrow & Return', sub: 'ระบบเบิกและคืนอุปกรณ์' },
                    'devices': { title: 'Device Inventory', sub: 'จัดการคลังวิทยุสื่อสาร' },
                    'employees': { title: 'Employees', sub: 'จัดการข้อมูลบุคลากร' },
                    'reports': { title: 'Reports', sub: 'รายงานและประวัติการใช้งาน' },
                    'settings': { title: 'Settings', sub: 'ตั้งค่าการเชื่อมต่อฐานข้อมูล' },
                    'data': { title: 'Data Management', sub: 'นำเข้าและส่งออกข้อมูล' }
                };
                
                if(titles[viewId]) {
                    document.getElementById('page-title').innerText = titles[viewId].title;
                    document.getElementById('page-subtitle').innerText = titles[viewId].sub;
                }
                this.renderCurrentView();
            },

            renderCurrentView: function() {
                const container = document.getElementById('view-container');
                container.innerHTML = ''; 
                container.className = 'fade-in pb-20';
                setTimeout(() => container.classList.remove('fade-in'), 400);

                if(views[state.currentView]) {
                    container.innerHTML = views[state.currentView]();
                    lucide.createIcons(); 
                }
            },

            renderNavigation: function() {
                const navContainer = document.getElementById('nav-container');
                navContainer.innerHTML = '';
                
                navItems.forEach(item => {
                    const isActive = state.currentView === item.id;
                    const btn = document.createElement('button');
                    btn.onclick = () => { this.switchView(item.id); if(window.innerWidth < 768) this.toggleMobileMenu(); };
                    btn.className = `w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-all duration-300 group ${
                        isActive ? 'bg-indigo-600/10 text-indigo-500 font-bold' : 'text-secondary hover-item'
                    }`;
                    btn.innerHTML = `
                        <i data-lucide="${item.icon}" class="w-5 h-5 ${isActive ? 'scale-110' : ''}"></i>
                        <span class="tracking-wide">${item.label}</span>
                    `;
                    navContainer.appendChild(btn);
                });

                const footer = document.getElementById('nav-footer');
                const isSettings = state.currentView === 'settings';
                const isData = state.currentView === 'data';
                
                footer.innerHTML = `
                    <button onclick="app.switchView('data')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover-item ${isData ? 'text-indigo-500 font-bold' : 'text-secondary'}">
                        <i data-lucide="database" class="w-5 h-5"></i> <span>จัดการข้อมูล</span>
                    </button>
                    <button onclick="app.switchView('settings')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover-item ${isSettings ? 'text-indigo-500 font-bold' : 'text-secondary'}">
                        <i data-lucide="settings" class="w-5 h-5"></i> <span>ตั้งค่าระบบ</span>
                    </button>
                    <button onclick="app.toggleTheme()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover-item text-secondary mt-2 border-t border-slate-500/20">
                        <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i> 
                        <span>${state.theme === 'dark' ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                    </button>
                `;
                lucide.createIcons({ root: navContainer });
                lucide.createIcons({ root: footer });
            },

            getStatusHTML: function(status) {
                if (status === 'available') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">ว่าง</span>';
                if (status === 'borrowed') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">ถูกยืม</span>';
                if (status === 'maintenance') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-rose-500/10 text-rose-500 border border-rose-500/20">ส่งซ่อม</span>';
                return '';
            }
        };

        // ==========================================
        // 3. ACTION HANDLERS
        // ==========================================
        
        function setTransType(type) {
            state.transForm.type = type;
            state.transForm.selectedDevices = [];
            app.renderCurrentView();
        }

        function toggleDeviceSelect(id) {
            const idx = state.transForm.selectedDevices.indexOf(id);
            if (idx > -1) state.transForm.selectedDevices.splice(idx, 1);
            else state.transForm.selectedDevices.push(id);
            app.renderCurrentView();
        }

        function handleTransaction(event) {
            event.preventDefault();
            const type = state.transForm.type;
            const devs = state.transForm.selectedDevices;
            
            // Get values from inputs (which can be mapped from Datalist)
            const empInput = document.getElementById('trans-emp')?.value || '';
            const location = document.getElementById('trans-loc')?.value || '-';
            const note = document.getElementById('trans-note').value;

            if (devs.length === 0) return alert('กรุณาเลือกอุปกรณ์อย่างน้อย 1 รายการ');
            
            let finalEmpId = empInput;
            if (type === 'borrow') {
                if (!empInput) return alert('กรุณาระบุผู้เบิก');
                // Extract ID if user selected from datalist format "EMP-001 - Name"
                if(empInput.includes(' - ')) finalEmpId = empInput.split(' - ')[0];
                
                if (!location) return alert('กรุณาระบุสถานที่');
            } else {
                // If return, get borrower from first device
                const d = state.devices.find(x => x.id === devs[0]);
                finalEmpId = d?.assignedTo || '';
            }

            const timestamp = new Date().toISOString();
            const newTrans = devs.map((devId, i) => ({
                id: `T-${Date.now()}-${i}`,
                deviceId: devId,
                employeeId: type === 'borrow' ? finalEmpId : null,
                type, timestamp, note, 
                location: type === 'borrow' ? location : '-'
            }));

            state.transactions = [...newTrans, ...state.transactions];
            
            const updatedDevices = [];
            state.devices = state.devices.map(d => {
                if (devs.includes(d.id)) {
                    const updated = { ...d, status: type === 'borrow' ? 'borrowed' : 'available', assignedTo: type === 'borrow' ? finalEmpId : null };
                    updatedDevices.push(updated);
                    return updated;
                }
                return d;
            });

            app.syncData({ action: 'transaction', newTransactions: newTrans, updatedDevices });
            state.transForm = { type: 'borrow', selectedDevices: [] };
            alert('บันทึกรายการสำเร็จ!');
            app.switchView('dashboard');
        }

        function addDevice(e) {
            e.preventDefault();
            const id = document.getElementById('dev-id').value;
            if(state.devices.find(d => d.id === id)) return alert('รหัสเครื่องซ้ำ');
            const newDev = { id, model: document.getElementById('dev-model').value, serial: document.getElementById('dev-sn').value, status: 'available' };
            state.devices.push(newDev);
            app.syncData({ action: 'addDevice', newDevice: newDev });
            app.renderCurrentView();
        }

        function addEmployee(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value;
            if(state.employees.find(x => x.id === id)) return alert('รหัสซ้ำ');
            const newEmp = { id, name: document.getElementById('emp-name').value, department: document.getElementById('emp-dept').value, phone: document.getElementById('emp-phone').value };
            state.employees.push(newEmp);
            app.syncData({ action: 'addEmployee', newEmployee: newEmp });
            app.renderCurrentView();
        }

        function updateDeviceStatus(id, newStatus) {
            if(newStatus === 'maintenance') {
                const note = prompt('ระบุอาการเสีย:');
                if(!note) return;
                const newTrans = { id: `M-${Date.now()}`, deviceId: id, employeeId: null, type: 'maintenance', timestamp: new Date().toISOString(), note: `ส่งซ่อม: ${note}`, location: '-' };
                state.transactions.unshift(newTrans);
                state.devices = state.devices.map(d => d.id === id ? {...d, status: 'maintenance'} : d);
                app.syncData({ action: 'transaction', newTransactions: [newTrans], updatedDevices: [{id, status: 'maintenance', assignedTo: ''}] });
            } else {
                state.devices = state.devices.map(d => d.id === id ? {...d, status: newStatus} : d);
                app.syncData({ action: 'transaction', newTransactions: [], updatedDevices: [{id, status: newStatus, assignedTo: ''}] });
            }
            app.renderCurrentView();
        }

        function exportCSV() {
            const start = document.getElementById('rep-start').value;
            const end = document.getElementById('rep-end').value;
            let filtered = state.transactions;
            
            if(start) filtered = filtered.filter(t => t.timestamp >= start);
            if(end) {
                const eDate = new Date(end); eDate.setHours(23,59,59);
                filtered = filtered.filter(t => new Date(t.timestamp) <= eDate);
            }

            if(filtered.length === 0) return alert('ไม่มีข้อมูล');

            const rows = filtered.map(t => {
                const emp = state.employees.find(e => e.id === t.employeeId);
                return `"${new Date(t.timestamp).toLocaleString('th-TH')}","${t.type === 'borrow' ? 'เบิก' : t.type==='maintenance'?'ซ่อม':'คืน'}","${t.deviceId}","${emp?emp.name:'-'}","${t.location||'-'}","${t.note||'-'}"`;
            });
            const csv = `\ufeff"วัน-เวลา","รายการ","รหัสเครื่อง","ผู้ทำรายการ","สถานที่","หมายเหตุ"\n` + rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `Report_${Date.now()}.csv`; a.click();
        }

        // ==========================================
        // 4. HTML VIEWS GENERATORS
        // ==========================================
        const views = {
            dashboard: () => {
                const total = state.devices.length;
                const avail = state.devices.filter(d => d.status === 'available').length;
                const borr = state.devices.filter(d => d.status === 'borrowed').length;
                const maint = state.devices.filter(d => d.status === 'maintenance').length;

                const trRows = state.transactions.slice(0, 5).map(t => {
                    const emp = state.employees.find(e => e.id === t.employeeId);
                    const typeLabel = t.type === 'borrow' ? 'เบิก' : t.type === 'maintenance' ? 'ซ่อม' : 'คืน';
                    const typeColor = t.type === 'borrow' ? 'amber' : t.type === 'maintenance' ? 'rose' : 'emerald';
                    return `
                        <tr class="border-b border-slate-500/10 hover-item">
                            <td class="p-4 text-sm text-secondary">${new Date(t.timestamp).toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'})}</td>
                            <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold bg-${typeColor}-500/10 text-${typeColor}-500">${typeLabel}</span></td>
                            <td class="p-4 font-bold text-primary">${t.deviceId}</td>
                            <td class="p-4 text-sm text-secondary">${emp ? emp.name : '-'}</td>
                        </tr>
                    `;
                }).join('') || `<tr><td colspan="4" class="p-6 text-center text-secondary">ไม่มีประวัติ</td></tr>`;

                return `
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-panel p-5 rounded-2xl border"><p class="text-3xl font-black text-blue-500">${total}</p><p class="text-xs text-secondary mt-1">วิทยุทั้งหมด</p></div>
                            <div class="bg-panel p-5 rounded-2xl border"><p class="text-3xl font-black text-emerald-500">${avail}</p><p class="text-xs text-secondary mt-1">พร้อมใช้งาน</p></div>
                            <div class="bg-panel p-5 rounded-2xl border"><p class="text-3xl font-black text-amber-500">${borr}</p><p class="text-xs text-secondary mt-1">ถูกยืม</p></div>
                            <div class="bg-panel p-5 rounded-2xl border"><p class="text-3xl font-black text-rose-500">${maint}</p><p class="text-xs text-secondary mt-1">ส่งซ่อม</p></div>
                        </div>
                        <div class="bg-panel border rounded-2xl overflow-hidden">
                            <div class="p-5 border-b border-slate-500/10 font-bold text-primary">ประวัติ 5 รายการล่าสุด</div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left min-w-[500px]">
                                    <thead><tr class="text-xs text-secondary bg-black/10"><th class="p-4">เวลา</th><th class="p-4">รายการ</th><th class="p-4">เครื่อง</th><th class="p-4">ผู้ทำรายการ</th></tr></thead>
                                    <tbody>${trRows}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            transactions: () => {
                const t = state.transForm;
                const list = t.type === 'borrow' ? state.devices.filter(d => d.status === 'available') : state.devices.filter(d => d.status === 'borrowed');
                
                const devsHtml = list.length > 0 ? list.map(d => {
                    const isSel = t.selectedDevices.includes(d.id);
                    const cBorder = isSel ? (t.type==='borrow'?'border-indigo-500 bg-indigo-500/10':'border-emerald-500 bg-emerald-500/10') : 'border-slate-500/20';
                    const cIcon = isSel ? (t.type==='borrow'?'text-indigo-500':'text-emerald-500') : 'text-secondary';
                    const empName = t.type === 'return' ? `<p class="text-xs mt-2 text-amber-500">ยืมโดย: ${state.employees.find(e => e.id === d.assignedTo)?.name || d.assignedTo}</p>` : '';
                    
                    return `
                        <div onclick="toggleDeviceSelect('${d.id}')" class="p-4 rounded-xl border-2 cursor-pointer transition ${cBorder}">
                            <div class="flex justify-between mb-2"><i data-lucide="radio" class="w-5 h-5 ${cIcon}"></i><i data-lucide="${isSel?'check-square':'square'}" class="w-5 h-5 ${cIcon}"></i></div>
                            <p class="font-bold text-primary">${d.id}</p>
                            ${empName}
                        </div>
                    `;
                }).join('') : `<div class="col-span-full p-8 text-center border border-dashed border-slate-500/30 rounded-xl text-secondary">ไม่มีอุปกรณ์</div>`;

                // DataList for Autocomplete
                const empOptions = state.employees.map(e => `<option value="${e.id} - ${e.name}">`).join('');
                
                // Extract unique locations from past transactions for datalist
                const uniqueLocs = [...new Set(state.transactions.map(tr => tr.location).filter(l => l && l !== '-'))];
                const locOptions = uniqueLocs.map(l => `<option value="${l}">`).join('');

                return `
                    <div class="max-w-4xl mx-auto">
                        <div class="flex p-1 bg-panel border rounded-xl mb-6">
                            <button onclick="setTransType('borrow')" class="flex-1 py-3 font-bold rounded-lg ${t.type==='borrow'?'bg-indigo-600 text-white':'text-secondary'}">เบิกอุปกรณ์</button>
                            <button onclick="setTransType('return')" class="flex-1 py-3 font-bold rounded-lg ${t.type==='return'?'bg-emerald-600 text-white':'text-secondary'}">คืนอุปกรณ์</button>
                        </div>

                        <form onsubmit="handleTransaction(event)" class="bg-panel border p-6 md:p-8 rounded-2xl space-y-6">
                            <div>
                                <label class="block font-bold text-primary mb-3">1. เลือกอุปกรณ์ (${t.selectedDevices.length})</label>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar">${devsHtml}</div>
                            </div>

                            ${t.type === 'borrow' ? `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-slate-500/20 pt-6">
                                    <div>
                                        <label class="block font-bold text-primary mb-2">2. ผู้เบิก (พิมพ์ค้นหา)</label>
                                        <input type="text" id="trans-emp" list="emp-list" required placeholder="รหัส หรือ ชื่อ..." class="w-full p-3 rounded-xl input-field border outline-none focus:border-indigo-500">
                                        <datalist id="emp-list">${empOptions}</datalist>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-primary mb-2">3. สถานที่ (พิมพ์ค้นหา)</label>
                                        <input type="text" id="trans-loc" list="loc-list" required placeholder="สถานที่ใช้งาน..." class="w-full p-3 rounded-xl input-field border outline-none focus:border-indigo-500">
                                        <datalist id="loc-list">${locOptions}</datalist>
                                    </div>
                                </div>
                            ` : ''}

                            <div class="border-t border-slate-500/20 pt-6">
                                <label class="block font-bold text-primary mb-2">หมายเหตุ</label>
                                <input type="text" id="trans-note" placeholder="เพิ่มเติม..." class="w-full p-3 rounded-xl input-field border outline-none focus:border-indigo-500">
                            </div>

                            <button type="submit" class="w-full py-4 rounded-xl font-bold text-white ${t.type==='borrow'?'bg-indigo-600':'bg-emerald-600'}">
                                ยืนยันทำรายการ
                            </button>
                        </form>
                    </div>
                `;
            },

            devices: () => {
                const list = state.devices.map(d => `
                    <div class="bg-panel border p-5 rounded-xl flex flex-col">
                        <div class="flex justify-between items-start mb-3">
                            <i data-lucide="radio" class="text-secondary"></i>
                            ${app.getStatusBadge(d.status)}
                        </div>
                        <h3 class="font-bold text-lg text-primary">${d.id}</h3>
                        <p class="text-xs text-secondary flex-1">${d.model}</p>
                        <div class="mt-4 flex space-x-2">
                            ${d.status !== 'borrowed' ? `
                                <button onclick="updateDeviceStatus('${d.id}', '${d.status==='maintenance'?'available':'maintenance'}')" class="text-xs font-bold px-3 py-1.5 rounded bg-slate-500/20 text-primary hover:bg-slate-500/40 w-full">
                                    ${d.status==='maintenance'?'ตั้งพร้อมใช้':'แจ้งซ่อม'}
                                </button>
                            ` : `<span class="text-xs text-center w-full py-1.5 text-secondary">ถูกยืมโดย ${d.assignedTo}</span>`}
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="space-y-6">
                        <form onsubmit="addDevice(event)" class="bg-panel border p-5 rounded-xl grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                            <div><label class="text-xs text-secondary">รหัส (ID)</label><input type="text" id="dev-id" required class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <div><label class="text-xs text-secondary">รุ่น</label><input type="text" id="dev-model" required class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <div><label class="text-xs text-secondary">S/N</label><input type="text" id="dev-sn" class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <button type="submit" class="bg-indigo-600 text-white font-bold p-2.5 rounded-lg h-[42px]">เพิ่มอุปกรณ์</button>
                        </form>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">${list}</div>
                    </div>
                `;
            },

            employees: () => {
                const list = state.employees.map(e => `
                    <tr class="border-b border-slate-500/10 hover-item">
                        <td class="p-4 font-bold text-primary">${e.id}</td>
                        <td class="p-4 text-primary">${e.name}</td>
                        <td class="p-4"><span class="px-2 py-1 bg-slate-500/20 rounded text-xs">${e.department}</span></td>
                        <td class="p-4 text-secondary">${e.phone || '-'}</td>
                    </tr>
                `).join('');

                return `
                    <div class="space-y-6">
                        <form onsubmit="addEmployee(event)" class="bg-panel border p-5 rounded-xl grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                            <div><label class="text-xs text-secondary">รหัส</label><input type="text" id="emp-id" required class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <div class="md:col-span-2"><label class="text-xs text-secondary">ชื่อ-สกุล</label><input type="text" id="emp-name" required class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <div><label class="text-xs text-secondary">แผนก</label><input type="text" id="emp-dept" required class="w-full p-2.5 rounded-lg input-field border mt-1"></div>
                            <button type="submit" class="bg-indigo-600 text-white font-bold p-2.5 rounded-lg h-[42px]">เพิ่มคน</button>
                        </form>
                        <div class="bg-panel border rounded-xl overflow-x-auto">
                            <table class="w-full text-left min-w-[600px]">
                                <thead><tr class="text-xs text-secondary bg-black/5"><th class="p-4">รหัส</th><th class="p-4">ชื่อ</th><th class="p-4">แผนก</th><th class="p-4">เบอร์โทร</th></tr></thead>
                                <tbody>${list}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            reports: () => {
                // Table is rendered on load, export button uses current data
                const trRows = state.transactions.map(t => {
                    const emp = state.employees.find(e => e.id === t.employeeId);
                    return `
                        <tr class="border-b border-slate-500/10 hover-item text-sm text-primary">
                            <td class="p-3">${new Date(t.timestamp).toLocaleDateString('th-TH')}</td>
                            <td class="p-3">${t.type==='borrow'?'เบิก':t.type==='maintenance'?'ซ่อม':'คืน'}</td>
                            <td class="p-3">${t.deviceId}</td>
                            <td class="p-3">${emp ? emp.name : '-'}</td>
                            <td class="p-3">${t.location || '-'}</td>
                            <td class="p-3 text-secondary text-xs">${t.note || '-'}</td>
                        </tr>
                    `;
                }).join('');

                return `
                    <div class="space-y-6">
                        <div class="bg-panel border p-5 rounded-xl flex flex-wrap gap-4 items-end">
                            <div><label class="text-xs text-secondary block mb-1">ตั้งแต่วันที่</label><input type="date" id="rep-start" class="p-2.5 rounded-lg input-field border"></div>
                            <div><label class="text-xs text-secondary block mb-1">ถึงวันที่</label><input type="date" id="rep-end" class="p-2.5 rounded-lg input-field border"></div>
                            <button onclick="exportCSV()" class="bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-lg flex items-center h-[42px]"><i data-lucide="download" class="w-4 h-4 mr-2"></i> Export CSV</button>
                        </div>
                        <div class="bg-panel border rounded-xl overflow-x-auto max-h-[60vh] relative">
                            <table class="w-full text-left min-w-[800px]">
                                <thead class="sticky top-0 bg-slate-800 text-slate-300 text-xs"><tr class="shadow-sm"><th class="p-3">วันที่</th><th class="p-3">รายการ</th><th class="p-3">เครื่อง</th><th class="p-3">คนทำรายการ</th><th class="p-3">สถานที่</th><th class="p-3">หมายเหตุ</th></tr></thead>
                                <tbody>${trRows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            settings: () => `
                <div class="max-w-2xl mx-auto space-y-6">
                    <form onsubmit="app.saveSettings(event)" class="bg-panel border p-8 rounded-2xl space-y-4">
                        <div>
                            <label class="block font-bold text-primary mb-2">URL ฐานข้อมูล (Google Apps Script)</label>
                            <input type="url" id="setting-url" value="${state.gasUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-3 rounded-xl input-field border outline-none focus:border-indigo-500">
                            <p class="text-xs text-secondary mt-2">ใส่ URL ที่ได้จากการ Deploy Google Apps Script เพื่อให้ระบบซิงค์ข้อมูลจริง</p>
                        </div>
                        <button type="submit" class="bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl w-full md:w-auto">บันทึกการตั้งค่า</button>
                    </form>
                </div>
            `,
            
            data: () => `<div class="text-center p-20 text-secondary bg-panel rounded-2xl border"><i data-lucide="database" class="w-16 h-16 mx-auto mb-4 opacity-30"></i><p class="text-xl font-bold text-primary">ระบบ Data Management</p><p>ใช้งานในส่วนหน้า Reports เพื่อ Export ข้อมูลได้เลย</p></div>`
        };

        // ==========================================
        // 5. START APP
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>
</html>
