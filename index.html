<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CommsControl - ระบบเบิกคืนวิทยุ (Vanilla JS)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060913">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar for modern look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Transition utility for DOM elements */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#060913] text-slate-100 font-sans transition-colors duration-700 selection:bg-indigo-500/30 overflow-hidden" id="body-tag">
    
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-600/20 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[30%] h-[40%] rounded-full bg-purple-600/20 blur-[120px] pointer-events-none z-0"></div>

    <div class="min-h-screen flex flex-col md:flex-row relative z-10">
        
        <div class="md:hidden px-6 py-4 flex justify-between items-center sticky top-0 z-40 backdrop-blur-2xl border-b bg-slate-900/60 border-white/5" id="mobile-header">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl shadow-lg shadow-indigo-500/30 text-white">
                    <i data-lucide="radio" class="w-5 h-5"></i>
                </div>
                <span class="font-black text-xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">Comms.</span>
            </div>
            <button onclick="app.toggleMobileMenu()" class="p-2 rounded-xl backdrop-blur-md transition-colors bg-white/5 text-slate-300">
                <i data-lucide="menu" id="mobile-menu-icon"></i>
            </button>
        </div>

        <aside id="sidebar" class="fixed md:relative top-0 left-0 z-30 h-screen md:h-[calc(100vh-2rem)] md:m-4 w-72 flex-shrink-0 flex flex-col rounded-none md:rounded-[2rem] transform -translate-x-full md:translate-x-0 transition-all duration-500 ease-out shadow-2xl md:shadow-[0_8px_32px_rgba(0,0,0,0.12)] bg-[#0f1524]/80 border md:border-white/5 backdrop-blur-2xl">
            <div class="p-8 hidden md:flex items-center space-x-4">
                <div class="p-3 bg-gradient-to-tr from-indigo-500 via-purple-500 to-indigo-500 bg-[length:200%_auto] rounded-2xl shadow-lg text-white transform hover:scale-105 duration-300">
                    <i data-lucide="radio" class="w-7 h-7"></i>
                </div>
                <span class="font-black text-3xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">Comms.</span>
            </div>
            
            <nav class="px-4 py-2 space-y-2 flex-1 mt-8 md:mt-0 overflow-y-auto hide-scroll" id="nav-container">
                <p class="px-5 text-[10px] font-black tracking-[0.2em] uppercase mb-4 text-slate-500">Application</p>
                </nav>

            <div class="p-4 mx-4 mb-4 rounded-3xl border space-y-2 bg-white/5 border-white/5" id="nav-footer">
                </div>
        </aside>

        <main class="flex-1 p-6 md:p-8 lg:p-12 w-full h-screen overflow-y-auto scroll-smooth relative z-10">
            
            <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-4 fade-in">
                <div>
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-4 border bg-indigo-500/10 text-indigo-400 border-indigo-500/20" id="header-badge">
                        <i data-lucide="sparkles" class="w-3 h-3 mr-1"></i> System Ready
                    </div>
                    <h1 id="page-title" class="text-4xl md:text-5xl font-black tracking-tight mb-2 text-white">Welcome back.</h1>
                    <p id="page-subtitle" class="text-base md:text-lg font-medium text-slate-400">จัดการวิทยุสื่อสารของคุณได้อย่างง่ายดายและชาญฉลาด</p>
                </div>
                
                <div class="hidden md:flex items-center space-x-4">
                    <div class="px-4 py-2 rounded-2xl backdrop-blur-xl border flex items-center space-x-3 bg-white/5 border-white/5" id="status-indicator">
                        <div class="w-2 h-2 rounded-full bg-amber-500" id="status-dot"></div>
                        <span class="text-sm font-bold text-slate-300" id="status-text">Local Mode</span>
                    </div>
                </div>
            </header>

            <div id="view-container" class="pb-20">
                </div>

        </main>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURATION & STATE
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx6x2YG9ikeoZUK5DUI9QJ4A8FmqtkNYjDnQMTmSZQg3HWx2d8CIk5gC5pYbHqq88YE/exec'; // ⚠️ ใส่ URL ของ Google Apps Script ที่นี่
        
        const state = {
            currentView: 'dashboard',
            isMobileMenuOpen: false,
            isLoading: false,
            isSyncing: false,
            devices: [
                { id: 'R-001', model: 'Motorola CP200d', serial: 'S/N-9901', status: 'available' },
                { id: 'R-002', model: 'Motorola CP200d', serial: 'S/N-9902', status: 'borrowed', assignedTo: 'EMP-001' },
                { id: 'R-003', model: 'Icom IC-V80', serial: 'S/N-8801', status: 'maintenance' }
            ],
            employees: [
                { id: 'EMP-001', name: 'สมชาย ใจกล้า', department: 'รักษาความปลอดภัย', phone: '081-111-1111' },
                { id: 'EMP-002', name: 'วิชัย รักงาน', department: 'ช่างซ่อมบำรุง', phone: '082-222-2222' }
            ],
            transactions: [],
            
            // Transaction Form State
            transForm: {
                type: 'borrow',
                selectedDevices: [],
                employeeId: '',
                location: '',
                note: ''
            }
        };

        const navItems = [
            { id: 'dashboard', icon: 'layout-dashboard', label: 'ภาพรวมระบบ' },
            { id: 'transactions', icon: 'arrow-right-left', label: 'เบิก-คืน อุปกรณ์' },
            { id: 'devices', icon: 'radio', label: 'คลังวิทยุสื่อสาร' },
            { id: 'employees', icon: 'users', label: 'บุคลากร' },
            { id: 'reports', icon: 'bar-chart-2', label: 'รายงาน' }
        ];

        // ==========================================
        // 2. CORE APP LOGIC
        // ==========================================
        const app = {
            init: function() {
                this.renderNavigation();
                this.fetchData();
                this.switchView('dashboard');
                lucide.createIcons(); // Initialize Icons
            },

            fetchData: async function() {
                if (!GAS_URL) return;
                this.updateStatus('Syncing...', true);
                try {
                    const response = await fetch(GAS_URL);
                    const data = await response.json();
                    if (data.devices) state.devices = data.devices;
                    if (data.employees) state.employees = data.employees;
                    if (data.transactions) state.transactions = data.transactions;
                    this.updateStatus('Online', false);
                    this.renderCurrentView();
                } catch (error) {
                    console.error("Error fetching data:", error);
                    this.updateStatus('Error', false, true);
                }
            },

            syncToGAS: async function(payload) {
                if (!GAS_URL) return;
                this.updateStatus('Syncing...', true);
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    this.updateStatus('Online', false);
                } catch (error) {
                    console.error("Sync Error:", error);
                    this.updateStatus('Error', false, true);
                }
            },

            updateStatus: function(text, isSpinning, isError = false) {
                const dot = document.getElementById('status-dot');
                const label = document.getElementById('status-text');
                label.innerText = text;
                if (isSpinning) {
                    dot.className = 'w-3 h-3 rounded-full border-2 border-indigo-400 border-t-transparent animate-spin bg-transparent';
                } else {
                    dot.className = `w-2 h-2 rounded-full ${isError ? 'bg-rose-500' : (GAS_URL ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500')}`;
                }
            },

            toggleMobileMenu: function() {
                state.isMobileMenuOpen = !state.isMobileMenuOpen;
                const sidebar = document.getElementById('sidebar');
                if(state.isMobileMenuOpen) {
                    sidebar.classList.remove('-translate-x-full');
                } else {
                    sidebar.classList.add('-translate-x-full');
                }
            },

            switchView: function(viewId) {
                state.currentView = viewId;
                this.renderNavigation();
                
                // Update Headers
                const titles = {
                    'dashboard': 'Welcome back.',
                    'transactions': 'Borrow & Return',
                    'devices': 'Device Inventory',
                    'employees': 'Directory',
                    'reports': 'Analytics & Reports',
                    'data': 'Data Management'
                };
                document.getElementById('page-title').innerText = titles[viewId] || '';
                
                this.renderCurrentView();
            },

            renderCurrentView: function() {
                const container = document.getElementById('view-container');
                container.innerHTML = ''; // Clear current
                container.className = 'fade-in'; // Trigger animation
                
                // Reset animation trigger
                setTimeout(() => container.classList.remove('fade-in'), 500);

                switch(state.currentView) {
                    case 'dashboard': container.innerHTML = views.dashboard(); break;
                    case 'transactions': container.innerHTML = views.transactions(); break;
                    case 'devices': container.innerHTML = views.devices(); break;
                    case 'employees': container.innerHTML = views.employees(); break;
                    case 'reports': container.innerHTML = views.reports(); break;
                    case 'data': container.innerHTML = views.data(); break;
                }
                lucide.createIcons(); // Re-render icons for new HTML
            },

            renderNavigation: function() {
                const navContainer = document.getElementById('nav-container');
                navContainer.innerHTML = `<p class="px-5 text-[10px] font-black tracking-[0.2em] uppercase mb-4 text-slate-500">Application</p>`;
                
                navItems.forEach(item => {
                    const isActive = state.currentView === item.id;
                    const btn = document.createElement('button');
                    btn.onclick = () => { this.switchView(item.id); if(window.innerWidth < 768) this.toggleMobileMenu(); };
                    btn.className = `w-full flex items-center space-x-3 px-5 py-4 rounded-2xl transition-all duration-500 group relative overflow-hidden ${
                        isActive ? 'text-white' : 'text-slate-400 hover:text-slate-100 hover:bg-white/5'
                    }`;
                    
                    btn.innerHTML = `
                        ${isActive ? '<div class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 opacity-90"></div>' : ''}
                        <div class="relative z-10 flex items-center w-full">
                            <i data-lucide="${item.icon}" class="w-5 h-5 transition-transform duration-500 mr-4 ${isActive ? 'scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]' : 'group-hover:scale-110 group-hover:rotate-6'}"></i>
                            <span class="font-semibold tracking-wide ${isActive ? 'drop-shadow-md' : ''}">${item.label}</span>
                            ${isActive ? '<i data-lucide="chevron-right" class="w-4 h-4 ml-auto opacity-80 animate-pulse"></i>' : ''}
                        </div>
                    `;
                    navContainer.appendChild(btn);
                });

                // Render Data Menu separately in footer
                const footer = document.getElementById('nav-footer');
                const isDataActive = state.currentView === 'data';
                footer.innerHTML = `
                    <button onclick="app.switchView('data')" class="w-full flex items-center space-x-3 px-5 py-4 rounded-2xl transition-all duration-500 relative overflow-hidden ${isDataActive ? 'text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
                        ${isDataActive ? '<div class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 opacity-90"></div>' : ''}
                        <div class="relative z-10 flex items-center w-full">
                            <i data-lucide="database" class="w-5 h-5 mr-4"></i>
                            <span class="font-semibold">จัดการข้อมูล</span>
                        </div>
                    </button>
                `;
            },
            
            // Reusable Badges
            getStatusBadge: function(status) {
                if (status === 'available') return '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">ว่าง / พร้อม</span>';
                if (status === 'borrowed') return '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">กำลังใช้งาน</span>';
                if (status === 'maintenance') return '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">ส่งซ่อม</span>';
                return '';
            }
        };

        // ==========================================
        // 3. ACTION HANDLERS (Global functions)
        // ==========================================
        
        // --- Transactions ---
        function setTransType(type) {
            state.transForm.type = type;
            state.transForm.selectedDevices = []; // reset selection
            app.renderCurrentView();
        }

        function toggleDeviceSelect(id) {
            const index = state.transForm.selectedDevices.indexOf(id);
            if (index > -1) state.transForm.selectedDevices.splice(index, 1);
            else state.transForm.selectedDevices.push(id);
            app.renderCurrentView(); // Simple re-render to update UI
        }

        function submitTransaction(event) {
            event.preventDefault();
            const { type, selectedDevices } = state.transForm;
            const empId = document.getElementById('trans-emp').value;
            const location = document.getElementById('trans-loc')?.value || '-';
            const note = document.getElementById('trans-note').value;

            if (selectedDevices.length === 0) return alert('กรุณาเลือกอุปกรณ์');
            if (type === 'borrow' && !empId) return alert('กรุณาเลือกผู้เบิก');
            if (type === 'borrow' && !location) return alert('กรุณาระบุสถานที่');

            let finalEmpId = empId;
            if (type === 'return') {
                // Find who borrowed it from the first device
                const d = state.devices.find(x => x.id === selectedDevices[0]);
                finalEmpId = d?.assignedTo || '';
            }

            const timestamp = new Date().toISOString();
            const newTrans = selectedDevices.map((devId, i) => ({
                id: `T-${Date.now()}-${i}`,
                deviceId: devId,
                employeeId: type === 'borrow' ? finalEmpId : null,
                type, timestamp, note, location: type === 'borrow' ? location : '-'
            }));

            // Update State
            state.transactions = [...newTrans, ...state.transactions];
            
            const updatedDevices = [];
            state.devices = state.devices.map(d => {
                if (selectedDevices.includes(d.id)) {
                    const updated = { ...d, status: type === 'borrow' ? 'borrowed' : 'available', assignedTo: type === 'borrow' ? finalEmpId : null };
                    updatedDevices.push(updated);
                    return updated;
                }
                return d;
            });

            // Sync
            app.syncToGAS({ action: 'transaction', newTransactions: newTrans, updatedDevices });
            
            // Reset & Redirect
            state.transForm = { type: 'borrow', selectedDevices: [], employeeId: '', location: '', note: '' };
            alert(`ทำรายการสำเร็จ ${selectedDevices.length} รายการ!`);
            app.switchView('dashboard');
        }

        // --- Devices ---
        function submitDevice(event) {
            event.preventDefault();
            const id = document.getElementById('dev-id').value;
            const model = document.getElementById('dev-model').value;
            const serial = document.getElementById('dev-serial').value;

            if(state.devices.find(d => d.id === id)) return alert('รหัสซ้ำ');

            const newDev = { id, model, serial, status: 'available', assignedTo: null };
            state.devices.push(newDev);
            app.syncToGAS({ action: 'addDevice', newDevice: newDev });
            app.renderCurrentView();
            alert('เพิ่มสำเร็จ');
        }

        // ==========================================
        // 4. VIEWS (HTML Generators)
        // ==========================================
        const views = {
            
            dashboard: () => {
                const available = state.devices.filter(d => d.status === 'available').length;
                const borrowed = state.devices.filter(d => d.status === 'borrowed').length;
                const maint = state.devices.filter(d => d.status === 'maintenance').length;

                // Recent Transactions HTML
                const recentHTML = state.transactions.slice(0, 5).map(t => {
                    const emp = state.employees.find(e => e.id === t.employeeId);
                    const typeHtml = t.type === 'maintenance' ? '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-rose-500/10 text-rose-400">แจ้งซ่อม</span>' : 
                                     t.type === 'borrow' ? '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-amber-500/10 text-amber-400">เบิกใช้งาน</span>' : 
                                     '<span class="px-3 py-1 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400">คืนอุปกรณ์</span>';
                    return `
                        <tr class="border-b border-white/5 hover:bg-white/[0.02] transition-colors">
                            <td class="p-4 text-sm text-slate-300">${new Date(t.timestamp).toLocaleString('th-TH')}</td>
                            <td class="p-4">${typeHtml}</td>
                            <td class="p-4 font-bold text-white">${t.deviceId}</td>
                            <td class="p-4 text-slate-300">${emp ? emp.name : '-'}</td>
                            <td class="p-4 text-slate-400">${t.location || '-'}</td>
                        </tr>
                    `;
                }).join('') || `<tr><td colspan="5" class="p-10 text-center text-slate-500">ไม่มีประวัติ</td></tr>`;

                return `
                    <div class="space-y-8">
                        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">
                            <div class="rounded-3xl p-6 bg-white/5 border border-white/10 flex items-center space-x-4">
                                <div class="p-4 rounded-2xl bg-blue-500/20 text-blue-400"><i data-lucide="radio" class="w-8 h-8"></i></div>
                                <div><p class="text-3xl font-black text-white">${state.devices.length}</p><p class="text-xs font-bold text-slate-400 uppercase">วิทยุทั้งหมด</p></div>
                            </div>
                            <div class="rounded-3xl p-6 bg-white/5 border border-white/10 flex items-center space-x-4">
                                <div class="p-4 rounded-2xl bg-emerald-500/20 text-emerald-400"><i data-lucide="check-circle-2" class="w-8 h-8"></i></div>
                                <div><p class="text-3xl font-black text-white">${available}</p><p class="text-xs font-bold text-slate-400 uppercase">พร้อมใช้งาน</p></div>
                            </div>
                            <div class="rounded-3xl p-6 bg-white/5 border border-white/10 flex items-center space-x-4">
                                <div class="p-4 rounded-2xl bg-amber-500/20 text-amber-400"><i data-lucide="arrow-right-left" class="w-8 h-8"></i></div>
                                <div><p class="text-3xl font-black text-white">${borrowed}</p><p class="text-xs font-bold text-slate-400 uppercase">ถูกเบิกใช้งาน</p></div>
                            </div>
                            <div class="rounded-3xl p-6 bg-white/5 border border-white/10 flex items-center space-x-4">
                                <div class="p-4 rounded-2xl bg-rose-500/20 text-rose-400"><i data-lucide="wrench" class="w-8 h-8"></i></div>
                                <div><p class="text-3xl font-black text-white">${maint}</p><p class="text-xs font-bold text-slate-400 uppercase">ส่งซ่อมบำรุง</p></div>
                            </div>
                        </div>

                        <div class="rounded-3xl border bg-white/5 border-white/10 overflow-hidden">
                            <div class="p-6 border-b border-white/5">
                                <h2 class="text-lg font-bold text-white flex items-center"><i data-lucide="clock" class="w-5 h-5 mr-2 text-slate-400"></i> ประวัติรายการล่าสุด</h2>
                            </div>
                            <div class="overflow-x-auto p-2">
                                <table class="w-full text-left min-w-[800px]">
                                    <thead><tr class="text-xs tracking-widest uppercase text-slate-500"><th class="p-4">วัน-เวลา</th><th class="p-4">รายการ</th><th class="p-4">รหัสเครื่อง</th><th class="p-4">ผู้ทำรายการ</th><th class="p-4">สถานที่</th></tr></thead>
                                    <tbody>${recentHTML}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            transactions: () => {
                const t = state.transForm;
                const list = t.type === 'borrow' ? state.devices.filter(d => d.status === 'available') : state.devices.filter(d => d.status === 'borrowed');
                
                const devicesHtml = list.length > 0 ? list.map(d => {
                    const isSelected = t.selectedDevices.includes(d.id);
                    const selClass = isSelected 
                        ? (t.type === 'borrow' ? 'bg-indigo-600/20 border-indigo-500' : 'bg-emerald-600/20 border-emerald-500') 
                        : 'bg-white/5 border-transparent';
                    const iconClass = isSelected ? (t.type === 'borrow' ? 'text-indigo-400' : 'text-emerald-400') : 'text-slate-500';
                    const checkIcon = isSelected ? 'check-square' : 'square';
                    
                    let extraInfo = '';
                    if (t.type === 'return') {
                        const empName = state.employees.find(e => e.id === d.assignedTo)?.name || d.assignedTo;
                        extraInfo = `<p class="text-xs mt-2 text-amber-400">ยืมโดย: ${empName}</p>`;
                    }

                    return `
                        <div onclick="toggleDeviceSelect('${d.id}')" class="p-5 rounded-2xl cursor-pointer border-2 transition-all ${selClass}">
                            <div class="flex justify-between items-start mb-2">
                                <i data-lucide="radio" class="${iconClass}"></i>
                                <i data-lucide="${checkIcon}" class="${iconClass} w-5 h-5"></i>
                            </div>
                            <p class="font-bold text-white text-lg">${d.id}</p>
                            <p class="text-xs text-slate-400">${d.model}</p>
                            ${extraInfo}
                        </div>
                    `;
                }).join('') : `<div class="col-span-full text-center p-10 text-slate-500 border border-dashed border-white/10 rounded-2xl">ไม่มีอุปกรณ์สำหรับรายการนี้</div>`;

                const empOptions = state.employees.map(e => `<option value="${e.id}" class="bg-slate-900">${e.id} - ${e.name}</option>`).join('');

                return `
                    <div class="max-w-4xl mx-auto space-y-6">
                        <div class="flex p-2 bg-white/5 border border-white/10 rounded-2xl">
                            <button onclick="setTransType('borrow')" class="flex-1 py-3 font-bold rounded-xl ${t.type === 'borrow' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">เบิกอุปกรณ์</button>
                            <button onclick="setTransType('return')" class="flex-1 py-3 font-bold rounded-xl ${t.type === 'return' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}">คืนอุปกรณ์</button>
                        </div>

                        <form onsubmit="submitTransaction(event)" class="bg-white/5 border border-white/10 p-8 rounded-[2rem] space-y-8">
                            
                            <div>
                                <h3 class="text-xl font-bold text-white mb-4">1. เลือกอุปกรณ์ <span class="text-sm font-normal text-slate-400 ml-2">(เลือกได้หลายรายการ)</span></h3>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                    ${devicesHtml}
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-white/10">
                                ${t.type === 'borrow' ? `
                                    <div>
                                        <label class="block text-sm font-bold text-slate-300 mb-2">2. ผู้เบิก</label>
                                        <select id="trans-emp" required class="w-full p-4 rounded-xl bg-slate-900/50 border border-white/10 text-white outline-none focus:border-indigo-500">
                                            <option value="" disabled selected hidden>เลือกพนักงาน...</option>
                                            ${empOptions}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-slate-300 mb-2">3. สถานที่</label>
                                        <input type="text" id="trans-loc" required placeholder="เช่น ลานจอดรถ..." class="w-full p-4 rounded-xl bg-slate-900/50 border border-white/10 text-white outline-none focus:border-indigo-500">
                                    </div>
                                ` : ''}
                                <div class="col-span-full">
                                    <label class="block text-sm font-bold text-slate-300 mb-2">หมายเหตุ</label>
                                    <textarea id="trans-note" class="w-full p-4 rounded-xl bg-slate-900/50 border border-white/10 text-white outline-none focus:border-indigo-500 h-24" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-5 rounded-2xl font-bold text-lg text-white ${t.type === 'borrow' ? 'bg-indigo-600' : 'bg-emerald-600'} hover:opacity-90">
                                ยืนยันทำรายการ (${t.selectedDevices.length} เครื่อง)
                            </button>
                        </form>
                    </div>
                `;
            },

            devices: () => {
                const html = state.devices.map(d => `
                    <div class="bg-white/5 border border-white/10 rounded-[2rem] p-6 hover:bg-white/10 transition">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-3 bg-white/10 rounded-xl text-white"><i data-lucide="radio"></i></div>
                            ${app.getStatusBadge(d.status)}
                        </div>
                        <h3 class="text-xl font-black text-white">${d.id}</h3>
                        <p class="text-xs text-slate-400 mb-4">${d.serial} &bull; ${d.model}</p>
                        ${d.status === 'borrowed' ? `<p class="text-xs text-amber-400 bg-amber-500/10 p-2 rounded-lg">ยืมโดย: ${d.assignedTo}</p>` : ''}
                    </div>
                `).join('');

                return `
                    <div class="space-y-6">
                        <form onsubmit="submitDevice(event)" class="bg-white/5 border border-white/10 p-6 rounded-3xl grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div><label class="block text-xs mb-1 text-slate-400">รหัสเครื่อง</label><input type="text" id="dev-id" required class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 text-white"></div>
                            <div><label class="block text-xs mb-1 text-slate-400">รุ่น</label><input type="text" id="dev-model" required class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 text-white"></div>
                            <div><label class="block text-xs mb-1 text-slate-400">S/N</label><input type="text" id="dev-serial" class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 text-white"></div>
                            <button type="submit" class="p-3 bg-indigo-600 text-white font-bold rounded-xl h-[50px]">เพิ่มข้อมูล</button>
                        </form>
                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            ${html}
                        </div>
                    </div>
                `;
            },

            employees: () => `<div class="text-center p-20 text-slate-500"><i data-lucide="users" class="w-16 h-16 mx-auto mb-4 opacity-30"></i><p class="text-xl font-bold">ข้อมูลบุคลากร</p><p>มีบุคลากรในระบบ ${state.employees.length} คน (สามารถพัฒนาฟอร์มจัดการต่อได้)</p></div>`,
            
            reports: () => `<div class="text-center p-20 text-slate-500"><i data-lucide="bar-chart-2" class="w-16 h-16 mx-auto mb-4 opacity-30"></i><p class="text-xl font-bold">หน้ารายงาน</p><p>ระบบพร้อมสำหรับการออกรายงาน</p></div>`,
            
            data: () => `<div class="text-center p-20 text-slate-500"><i data-lucide="database" class="w-16 h-16 mx-auto mb-4 opacity-30"></i><p class="text-xl font-bold">จัดการข้อมูล</p><p>ระบบ Export/Import เตรียมพร้อมในโครงสร้าง Data</p></div>`
        };

        // ==========================================
        // 5. INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
