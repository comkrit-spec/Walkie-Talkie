<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="doc-title">CommsControl - ระบบจัดการวิทยุสื่อสาร</title>
    
    <meta name="theme-color" content="#060913">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .toast-slide { animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        body.light-theme { background-color: #f8fafc; color: #0f172a; }
        body.light-theme .bg-panel { background-color: #ffffff; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        body.light-theme .text-primary { color: #0f172a; }
        body.light-theme .text-secondary { color: #64748b; }
        body.light-theme .input-field { background-color: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        body.light-theme .hover-item:hover { background-color: #f1f5f9; }
        body.light-theme .table-header { background-color: #f1f5f9; color: #475569; }
        
        body { background-color: #060913; color: #f1f5f9; }
        .bg-panel { background-color: rgba(15, 23, 42, 0.4); border-color: rgba(255,255,255,0.05); backdrop-filter: blur(24px); }
        .text-primary { color: #ffffff; }
        .text-secondary { color: #94a3b8; }
        .input-field { background-color: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.08); color: #ffffff; }
        .hover-item:hover { background-color: rgba(255,255,255,0.04); }
        .table-header { background-color: rgba(0,0,0,0.2); color: #94a3b8; }
        
        .progress-ring { transition: stroke-dashoffset 1.5s ease-in-out; }
    </style>
</head>
<body class="font-sans transition-colors duration-500 overflow-hidden" id="body-tag">
    
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-600/15 blur-[140px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40%] h-[50%] rounded-full bg-purple-600/15 blur-[140px] pointer-events-none z-0"></div>

    <div id="app-root" class="h-screen w-full relative z-10 flex overflow-hidden"></div>
    <div id="modal-root" class="relative z-50"></div>
    <div id="toast-root" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(()=> console.log('Service Worker disabled.'));
            });
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
