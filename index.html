<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CommsControl - ระบบจัดการวิทยุสื่อสาร</title>
    
    <meta name="theme-color" content="#060913">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.light-theme { background-color: #f8fafc; color: #0f172a; }
        body.light-theme .bg-panel { background-color: #ffffff; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        body.light-theme .text-primary { color: #0f172a; }
        body.light-theme .text-secondary { color: #64748b; }
        body.light-theme .input-field { background-color: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        body.light-theme .hover-item:hover { background-color: #f1f5f9; }
        body.light-theme .table-header { background-color: #f1f5f9; color: #475569; }
        
        body { background-color: #060913; color: #f1f5f9; }
        .bg-panel { background-color: rgba(15, 23, 42, 0.4); border-color: rgba(255,255,255,0.05); backdrop-filter: blur(24px); }
        .text-primary { color: #ffffff; }
        .text-secondary { color: #94a3b8; }
        .input-field { background-color: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.08); color: #ffffff; }
        .hover-item:hover { background-color: rgba(255,255,255,0.04); }
        .table-header { background-color: rgba(0,0,0,0.2); color: #94a3b8; }
    </style>
</head>
<body class="font-sans transition-colors duration-500 overflow-hidden" id="body-tag">
    
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-600/15 blur-[140px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40%] h-[50%] rounded-full bg-purple-600/15 blur-[140px] pointer-events-none z-0"></div>

    <div id="app-root" class="min-h-screen w-full relative z-10"></div>

    <script>
        // ==========================================
        // 1. STATE & MOCK DATA
        // ==========================================
        const state = {
            isLoggedIn: sessionStorage.getItem('comms_logged_in') === 'true',
            user: JSON.parse(sessionStorage.getItem('comms_user')) || null,
            currentView: 'dashboard',
            isMobileMenuOpen: false,
            theme: localStorage.getItem('comms_theme') || 'dark',
            gasUrl: localStorage.getItem('comms_gas_url') || '',
            
            devices: [], employees: [], transactions: [], users: [],
            transForm: { type: 'borrow', selectedDevices: [] },
            userForm: { isEditing: false, oldUsername: '' },
            idleTimer: null, autoRefreshInterval: null
        };

        const fallbackData = {
            devices: [
                { id: 'R-001', model: 'Motorola CP200d', serial: 'S/N-9901', status: 'available', assignedTo: '' },
                { id: 'R-002', model: 'Motorola CP200d', serial: 'S/N-9902', status: 'borrowed', assignedTo: 'EMP-001' },
                { id: 'R-003', model: 'Icom IC-V80', serial: 'S/N-8801', status: 'maintenance', assignedTo: '' }
            ],
            employees: [
                { id: 'EMP-001', name: 'สมชาย ใจกล้า', department: 'รักษาความปลอดภัย', phone: '081-111-1111' },
                { id: 'EMP-002', name: 'วิชัย รักงาน', department: 'ช่างซ่อมบำรุง', phone: '082-222-2222' }
            ],
            transactions: [],
            users: [
                { username: 'admin', password: 'admin1234', role: 'ผู้ดูแลระบบ' },
                { username: 'user', password: '1234', role: 'เจ้าหน้าที่' }
            ]
        };

        const navItems = [
            { id: 'dashboard', icon: 'layout-dashboard', label: 'ภาพรวมระบบ' },
            { id: 'transactions', icon: 'arrow-right-left', label: 'เบิก-คืน อุปกรณ์' },
            { id: 'devices', icon: 'radio', label: 'คลังอุปกรณ์' },
            { id: 'employees', icon: 'users', label: 'บุคลากร' },
            { id: 'reports', icon: 'file-bar-chart', label: 'รายงาน' }
        ];

        // ==========================================
        // 2. CORE APP ENGINE
        // ==========================================
        const app = {
            init: function() {
                this.applyTheme();
                if (state.isLoggedIn) {
                    this.renderMainLayout();
                    this.startSessionTracking();
                    this.fetchData();
                    this.startAutoRefresh();
                } else {
                    this.fetchDataForLogin();
                }
            },

            fetchDataForLogin: async function() {
                if (!state.gasUrl) {
                    state.users = fallbackData.users;
                    this.renderLoginScreen();
                    return;
                }
                try {
                    const res = await fetch(state.gasUrl);
                    const data = await res.json();
                    if (data.users) state.users = data.users;
                } catch (e) {
                    console.error('Error fetching users:', e);
                    state.users = fallbackData.users;
                }
                this.renderLoginScreen();
            },

            handleLogin: function(e) {
                e.preventDefault();
                const user = document.getElementById('login-user').value.trim();
                const pass = document.getElementById('login-pass').value;

                const foundUser = state.users.find(u => u.username === user && u.password === pass);

                if (foundUser) {
                    state.isLoggedIn = true;
                    state.user = { username: foundUser.username, role: foundUser.role };
                    sessionStorage.setItem('comms_logged_in', 'true');
                    sessionStorage.setItem('comms_user', JSON.stringify(state.user));
                    this.renderMainLayout();
                    this.startSessionTracking();
                    this.fetchData();
                    this.startAutoRefresh();
                } else {
                    alert('❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                }
            },

            handleLogout: function(reason) {
                state.isLoggedIn = false;
                state.user = null;
                sessionStorage.clear();
                clearInterval(state.autoRefreshInterval);
                this.stopSessionTracking();
                this.fetchDataForLogin(); 
                if (reason === 'idle') alert('🔒 ระบบได้ล็อกเอาต์อัตโนมัติเนื่องจากไม่มีการใช้งานเกิน 10 นาที');
            },

            startSessionTracking: function() {
                this.stopSessionTracking();
                const resetTimer = () => {
                    clearTimeout(state.idleTimer);
                    if (state.isLoggedIn) state.idleTimer = setTimeout(() => this.handleLogout('idle'), 600000);
                };
                window._idleListeners = ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => window.addEventListener(evt, resetTimer));
                resetTimer();
            },
            stopSessionTracking: function() { clearTimeout(state.idleTimer); },

            startAutoRefresh: function() {
                clearInterval(state.autoRefreshInterval);
                state.autoRefreshInterval = setInterval(() => {
                    if (state.isLoggedIn && state.gasUrl) this.fetchData(true);
                }, 30000);
            },

            fetchData: async function(isBackground = false) {
                if (!state.gasUrl) {
                    if(state.devices.length === 0) {
                        state.devices = fallbackData.devices;
                        state.employees = fallbackData.employees;
                        state.transactions = fallbackData.transactions;
                        state.users = fallbackData.users;
                    }
                    this.updateStatus('Local Mode', 'amber');
                    if(!isBackground) this.renderCurrentView();
                    return;
                }
                if(!isBackground) this.updateStatus('Syncing...', 'spin');
                try {
                    const response = await fetch(state.gasUrl);
                    const data = await response.json();
                    if (data.devices) state.devices = data.devices;
                    if (data.employees) state.employees = data.employees;
                    if (data.transactions) state.transactions = data.transactions;
                    if (data.users) state.users = data.users;
                    this.updateStatus('Online', 'emerald');
                } catch (error) {
                    this.updateStatus('Error Connecting', 'rose');
                } finally {
                    if(!isBackground && state.currentView !== 'settings') this.renderCurrentView();
                }
            },

            syncData: async function(payload) {
                this.updateStatus('Saving...', 'spin');
                if (!state.gasUrl) {
                    this.updateStatus('Local Mode', 'amber');
                    this.renderCurrentView();
                    return;
                }
                try {
                    await fetch(state.gasUrl, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }});
                    this.updateStatus('Online', 'emerald');
                    this.fetchData(true); 
                } catch (error) {
                    this.updateStatus('Error saving', 'rose');
                }
            },

            applyTheme: function() {
                const body = document.getElementById('body-tag');
                if (state.theme === 'light') body.classList.add('light-theme');
                else body.classList.remove('light-theme');
                if(state.isLoggedIn) this.renderNavigation(); 
            },

            toggleTheme: function() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('comms_theme', state.theme);
                this.applyTheme();
                if(state.currentView === 'settings') this.renderCurrentView();
            },

            updateStatus: function(text, color) {
                const dot = document.getElementById('status-dot');
                const label = document.getElementById('status-text');
                if(label) label.innerText = text;
                if(dot) {
                    if (color === 'spin') dot.className = 'w-3 h-3 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin bg-transparent';
                    else dot.className = `w-2.5 h-2.5 rounded-full bg-${color}-500 ${color==='emerald' ? 'animate-pulse' : ''}`;
                }
            },

            renderLoginScreen: function() {
                document.getElementById('app-root').innerHTML = views.login();
                lucide.createIcons();
            },

            renderMainLayout: function() {
                document.getElementById('app-root').innerHTML = views.mainStructure();
                this.renderNavigation();
                this.switchView('dashboard');
            },

            switchView: function(viewId) {
                state.currentView = viewId;
                this.renderNavigation();
                
                const titles = {
                    'dashboard': { title: 'Welcome back.', sub: 'ภาพรวมระบบและการทำรายการวันนี้แบบเรียลไทม์' },
                    'transactions': { title: 'Borrow & Return', sub: 'ระบบเบิก-คืนอุปกรณ์สื่อสาร' },
                    'devices': { title: 'Device Inventory', sub: 'ตรวจสอบสถานะและจัดการคลังวิทยุสื่อสาร' },
                    'employees': { title: 'Employee Directory', sub: 'รายชื่อบุคลากรที่มีสิทธิ์เข้าถึงระบบ' },
                    'reports': { title: 'Analytics & Reports', sub: 'ประวัติการเข้าใช้งานและออกรายงานตามช่วงเวลา' },
                    'settings': { title: 'System Settings', sub: 'ศูนย์ควบคุม ตั้งค่าระบบ ฐานข้อมูล และจัดการผู้ใช้งาน' }
                };
                
                if(titles[viewId]) {
                    document.getElementById('page-title').innerText = titles[viewId].title;
                    document.getElementById('page-subtitle').innerText = titles[viewId].sub;
                }
                this.renderCurrentView();
            },

            renderCurrentView: function() {
                const container = document.getElementById('view-container');
                if (!container) return;
                container.innerHTML = ''; 
                container.className = 'fade-in pb-20';
                
                if(views[state.currentView]) {
                    container.innerHTML = views[state.currentView]();
                    lucide.createIcons({ root: container }); 
                }
            },

            renderNavigation: function() {
                const navContainer = document.getElementById('nav-container');
                if (!navContainer) return;
                navContainer.innerHTML = `<p class="px-5 text-[10px] font-black tracking-[0.2em] uppercase mb-4 text-slate-500">Application</p>`;
                
                navItems.forEach(item => {
                    const isActive = state.currentView === item.id;
                    const btn = document.createElement('button');
                    btn.onclick = () => { this.switchView(item.id); if(state.isMobileMenuOpen) this.toggleMobileMenu(); };
                    btn.className = `w-full flex items-center space-x-3 px-5 py-3.5 rounded-2xl transition-all duration-300 group relative overflow-hidden ${isActive ? 'text-white' : 'text-slate-400 hover:text-slate-100 hover:bg-white/5'}`;
                    btn.innerHTML = `
                        ${isActive ? '<div class="absolute inset-0 bg-gradient-to-r from-indigo-600 to-purple-600 opacity-90"></div>' : ''}
                        <div class="relative z-10 flex items-center w-full">
                            <i data-lucide="${item.icon}" class="w-5 h-5 mr-4 ${isActive ? 'scale-110 drop-shadow-[0_0_6px_rgba(255,255,255,0.4)]' : 'group-hover:scale-110'}"></i>
                            <span class="font-semibold text-sm">${item.label}</span>
                        </div>
                    `;
                    navContainer.appendChild(btn);
                });

                const footer = document.getElementById('nav-footer');
                const isSettings = state.currentView === 'settings';
                footer.innerHTML = `
                    <button onclick="app.switchView('settings')" class="w-full flex items-center space-x-3 px-5 py-3.5 rounded-xl transition-all hover-item ${isSettings ? 'text-indigo-500 font-bold bg-indigo-500/5' : 'text-slate-400'}">
                        <i data-lucide="settings" class="w-5 h-5"></i> <span class="text-sm">ตั้งค่าระบบ</span>
                    </button>
                    <button onclick="app.toggleTheme()" class="w-full flex items-center space-x-3 px-5 py-3.5 rounded-xl transition-all hover-item text-slate-400 mt-1">
                        <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i> <span class="text-sm">${state.theme === 'dark' ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                    </button>
                    <button onclick="app.handleLogout()" class="w-full flex items-center space-x-3 px-5 py-3.5 rounded-xl transition-all hover:text-rose-500 text-slate-500 border-t border-slate-500/10 mt-2 pt-3">
                        <i data-lucide="log-out" class="w-5 h-5"></i> <span class="text-sm">ออกจากระบบ</span>
                    </button>
                `;
                lucide.createIcons({ root: navContainer });
                lucide.createIcons({ root: footer });
            },

            toggleMobileMenu: function() {
                state.isMobileMenuOpen = !state.isMobileMenuOpen;
                const sidebar = document.getElementById('sidebar');
                if(state.isMobileMenuOpen) sidebar.classList.remove('-translate-x-full');
                else sidebar.classList.add('-translate-x-full');
            },
            
            getStatusHTML: function(status) {
                if (status === 'available') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">ว่าง</span>';
                if (status === 'borrowed') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">ถูกยืม</span>';
                if (status === 'maintenance') return '<span class="px-3 py-1 rounded-md text-[10px] font-bold bg-rose-500/10 text-rose-500 border border-rose-500/20">ส่งซ่อม</span>';
                return '';
            }
        };

        // ==========================================
        // 3. ACTION HANDLERS
        // ==========================================
        function setTransType(type) { state.transForm.type = type; state.transForm.selectedDevices = []; app.renderCurrentView(); }
        function toggleDeviceSelect(id) { 
            const idx = state.transForm.selectedDevices.indexOf(id); 
            if(idx > -1) state.transForm.selectedDevices.splice(idx,1); 
            else state.transForm.selectedDevices.push(id); 
            app.renderCurrentView(); 
        }

        function handleTransaction(event) {
            event.preventDefault();
            const type = state.transForm.type;
            const devs = state.transForm.selectedDevices;
            
            const empInput = document.getElementById('trans-emp')?.value || '';
            const location = document.getElementById('trans-loc')?.value || '-';
            const note = document.getElementById('trans-note').value;

            if (devs.length === 0) return alert('❌ กรุณาเลือกอุปกรณ์อย่างน้อย 1 รายการ');
            
            let finalEmpId = empInput;
            if (type === 'borrow') {
                if (!empInput) return alert('❌ กรุณาระบุชื่อผู้เบิก');
                if (empInput.includes(' - ')) finalEmpId = empInput.split(' - ')[0]; 
                if (!location) return alert('❌ กรุณาระบุสถานที่ใช้งาน');
            } else {
                const activeDev = state.devices.find(x => x.id === devs[0]);
                finalEmpId = activeDev?.assignedTo || '';
            }

            const timestamp = new Date().toISOString();
            const newTrans = devs.map((devId, i) => ({
                id: `T-${Date.now()}-${i}`, deviceId: devId, employeeId: type === 'borrow' ? finalEmpId : null,
                type, timestamp, note, location: type === 'borrow' ? location : '-'
            }));

            state.transactions = [...newTrans, ...state.transactions];
            const updatedDevices = [];
            state.devices = state.devices.map(d => {
                if (devs.includes(d.id)) {
                    const updated = { ...d, status: type === 'borrow' ? 'borrowed' : 'available', assignedTo: type === 'borrow' ? finalEmpId : null };
                    updatedDevices.push(updated); return updated;
                }
                return d;
            });

            app.syncData({ action: 'transaction', newTransactions: newTrans, updatedDevices });
            state.transForm = { type: 'borrow', selectedDevices: [] };
            alert(`🎉 บันทึกรายการสำเร็จจำนวน ${devs.length} เครื่อง`);
            app.switchView('dashboard');
        }

        function submitDevice(e) {
            e.preventDefault();
            const id = document.getElementById('dev-id').value.toUpperCase().trim();
            const model = document.getElementById('dev-model').value.trim();
            const serial = document.getElementById('dev-sn').value.trim();

            if (state.devices.find(d => d.id === id)) return alert('❌ รหัสอุปกรณ์นี้มีอยู่ในระบบคลังแล้วครับ');
            const newDev = { id, model, serial, status: 'available', assignedTo: null };
            state.devices.push(newDev);
            app.syncData({ action: 'addDevice', newDevice: newDev });
            alert('📥 เพิ่มวิทยุสื่อสารเข้าคลังเรียบร้อยครับ');
            app.renderCurrentView();
        }

        function submitEmployee(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value.toUpperCase().trim();
            const name = document.getElementById('emp-name').value.trim();
            const department = document.getElementById('emp-dept').value.trim();
            const phone = document.getElementById('emp-phone').value.trim();

            if (state.employees.find(x => x.id === id)) return alert('❌ รหัสพนักงานนี้มีอยู่แล้วครับ');
            const newEmp = { id, name, department, phone };
            state.employees.push(newEmp);
            app.syncData({ action: 'addEmployee', newEmployee: newEmp });
            alert('👤 ลงทะเบียนรายชื่อบุคลากรใหม่สำเร็จ');
            app.renderCurrentView();
        }

        function changeDeviceStatus(id, targetStatus) {
            let note = '-';
            if(targetStatus === 'maintenance') {
                note = prompt('🛠️ กรุณาระบุอาการเสีย/ปัญหาการใช้งาน:');
                if(!note) return; 
            }
            const newTrans = { id: `M-${Date.now()}`, deviceId: id, employeeId: null, type: targetStatus, timestamp: new Date().toISOString(), note: targetStatus==='maintenance'?`แจ้งซ่อม: ${note}`:'ช่างตรวจสภาพและปลดล็อกเครื่อง', location: '-' };
            state.transactions.unshift(newTrans);
            state.devices = state.devices.map(d => d.id === id ? { ...d, status: targetStatus, assignedTo: null } : d);
            app.syncData({ action: 'transaction', newTransactions: [newTrans], updatedDevices: [{ id, status: targetStatus, assignedTo: '' }] });
            app.renderCurrentView();
        }

        function executeExportCSV() {
            const start = document.getElementById('rep-start').value;
            const end = document.getElementById('rep-end').value;
            let filtered = state.transactions;
            
            if(start) filtered = filtered.filter(t => t.timestamp >= start);
            if(end) {
                const eDate = new Date(end); eDate.setHours(23,59,59);
                filtered = filtered.filter(t => new Date(t.timestamp) <= eDate);
            }
            if(filtered.length === 0) return alert('ไม่มีข้อมูลในช่วงเวลาที่ระบุ');

            const rows = filtered.map(t => {
                const emp = state.employees.find(e => e.id === t.employeeId);
                const typeLabel = t.type==='borrow'?'เบิก':t.type==='maintenance'?'ซ่อม':'คืน';
                return `"${new Date(t.timestamp).toLocaleString('th-TH')}","${typeLabel}","${t.deviceId}","${emp?emp.name:'-'}","${t.location||'-'}","${t.note||'-'}"`;
            });
            const csv = `\ufeff"วัน-เวลา","รายการ","รหัสเครื่อง","ผู้ทำรายการ","สถานที่","หมายเหตุ"\n` + rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `CommsControl_Report_${Date.now()}.csv`; a.click();
        }

        function exportBackupJSON() {
            const backup = { devices: state.devices, employees: state.employees, transactions: state.transactions, users: state.users };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `CommsControl_Backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
        }

        function importBackupJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if(confirm(`⚠️ ยืนยันการกู้คืนข้อมูลทับข้อมูลปัจจุบัน?\n- วิทยุ ${data.devices?.length || 0} เครื่อง\n- บุคลากร ${data.employees?.length || 0} คน`)) {
                        if(data.devices) state.devices = data.devices;
                        if(data.employees) state.employees = data.employees;
                        if(data.transactions) state.transactions = data.transactions;
                        if(data.users) state.users = data.users;
                        alert('✅ กู้คืนข้อมูลเข้าระบบ Local สำเร็จ!');
                        app.renderCurrentView();
                    }

            };
            reader.readAsText(file);

        function saveDatabaseSettings(e) {
            e.preventDefault();
            const url = document.getElementById('setting-url').value.trim();
            state.gasUrl = url;
            localStorage.setItem('comms_gas_url', url);
            alert('💾 บันทึกการเชื่อมต่อฐานข้อมูลเรียบร้อย ระบบกำลังซิงค์ข้อมูลใหม่...');
            app.fetchData();
        }

        function submitSystemUser(e) {
            e.preventDefault();
            const user = document.getElementById('sys-username').value.trim();
            const pass = document.getElementById('sys-password').value;
            const role = document.getElementById('sys-role').value;

            if (state.userForm.isEditing) {
                state.users = state.users.map(u => u.username === state.userForm.oldUsername ? { username: user, password: pass, role } : u);
            } else {
                if (state.users.find(u => u.username === user)) return alert('❌ Username นี้มีคนใช้งานแล้ว');
                state.users.push({ username: user, password: pass, role });
            }
            
            app.syncData({ action: 'syncUsers', users: state.users });
            state.userForm = { isEditing: false, oldUsername: '' }; 
            app.renderCurrentView();
            alert('👤 บันทึกข้อมูลผู้ใช้เรียบร้อย');
        }

        function editSystemUser(username) {
            const user = state.users.find(u => u.username === username);
            if (!user) return;
            state.userForm = { isEditing: true, oldUsername: user.username };
            app.renderCurrentView();
            setTimeout(() => {
                document.getElementById('sys-username').value = user.username;
                document.getElementById('sys-password').value = user.password;
                document.getElementById('sys-role').value = user.role;
                document.getElementById('sys-username').focus();
            }, 50);
        }

        function deleteSystemUser(username) {
            if (username === 'admin') return alert('❌ ไม่อนุญาตให้ลบบัญชี admin หลักของระบบเด็ดขาด');
            if (username === state.user.username) return alert('❌ คุณไม่สามารถลบบัญชีตัวเองที่กำลังล็อกอินอยู่ได้');
            
            if(confirm(`⚠️ ยืนยันที่จะลบบัญชี ${username} ออกจากระบบ?`)) {

                app.syncData({ action: 'syncUsers', users: state.users });

                            <div class="w-full sm:w-auto"><label class="text-xs font-bold text-secondary block mb-1">ตั้งแต่วันที่</label><input type="date" id="rep-start" class="p-2.5 rounded-xl input-field border text-sm font-bold"></div>
                            <div class="w-full sm:w-auto"><label class="text-xs font-bold text-secondary block mb-1">ถึงวันที่</label><input type="date" id="rep-end" class="p-2.5 rounded-xl input-field border text-sm font-bold"></div>
                            <button onclick="executeExportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm px-6 py-3 rounded-xl flex items-center h-[42px] shadow-lg shadow-emerald-600/10"><i data-lucide="download" class="w-4 h-4 mr-2"></i> ส่งออกตารางรายงาน (CSV)</button>
                        </div>
                        <div class="bg-panel border rounded-2xl overflow-x-auto max-h-[60vh] relative shadow-inner">
                            <table class="w-full text-left min-w-[800px]"><thead class="sticky top-0 bg-slate-900/90 border-b border-slate-500/10 text-secondary text-xs"><tr class="table-header"><th class="p-4">วัน-เวลา</th><th class="p-4">รายการ</th><th class="p-4">เครื่อง</th><th class="p-4">ผู้ปฏิบัติงาน</th><th class="p-4">สถานที่</th><th class="p-4">หมายเหตุ</th></tr></thead><tbody>${trRows}</tbody></table>
                        </div>
                    </div>
                `;
            },

            settings: () => {
                const userRows = state.users.map(u => `
                    <tr class="border-b border-slate-500/10 hover-item text-sm">
                        <td class="p-4 font-bold text-primary">${u.username}</td>
                        <td class="p-4 text-secondary text-xs">••••••••</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-slate-500/10 border border-slate-500/20 text-secondary rounded-lg text-[10px] font-semibold">${u.role}</span></td>
                        <td class="p-4 text-right space-x-2">
                            ${state.user.role === 'ผู้ดูแลระบบ' ? `
                                <button onclick="editSystemUser('${u.username}')" class="p-2 rounded-lg transition-colors text-slate-400 hover:text-indigo-500 hover:bg-indigo-500/10"><i data-lucide="edit" class="w-4 h-4"></i></button>
                                <button onclick="deleteSystemUser('${u.username}')" class="p-2 rounded-lg transition-colors text-slate-400 hover:text-rose-500 hover:bg-rose-500/10"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            ` : `<span class="text-xs text-slate-500">ไม่มีสิทธิ์</span>`}
                        </td>
                    </tr>
                `).join('');

                const isEdit = state.userForm.isEditing;

                return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-panel border p-6 md:p-8 rounded-[2rem] shadow-xl">
                        <h3 class="text-xl font-black text-primary flex items-center mb-6"><i data-lucide="users" class="w-5 h-5 mr-3 text-purple-500"></i> การจัดการผู้ใช้งาน (Users)</h3>
                        ${state.user.role === 'ผู้ดูแลระบบ' ? `
                        <form onsubmit="submitSystemUser(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8 bg-black/10 p-5 rounded-2xl border border-slate-500/10">
                            <div><label class="block text-xs font-bold text-secondary mb-1">Username</label><input type="text" id="sys-username" required class="w-full p-2.5 rounded-xl input-field border text-sm font-bold"></div>
                            <div><label class="block text-xs font-bold text-secondary mb-1">Password</label><input type="text" id="sys-password" required class="w-full p-2.5 rounded-xl input-field border text-sm font-bold"></div>
                            <div><label class="block text-xs font-bold text-secondary mb-1">สิทธิ์ (Role)</label><select id="sys-role" class="w-full p-2.5 rounded-xl input-field border text-sm font-bold outline-none"><option value="เจ้าหน้าที่">เจ้าหน้าที่</option><option value="ผู้ดูแลระบบ">ผู้ดูแลระบบ</option></select></div>
                            <div class="flex items-end"><button type="submit" class="w-full p-3 rounded-xl font-bold text-white text-sm transition-all ${isEdit ? 'bg-amber-600 hover:bg-amber-500' : 'bg-purple-600 hover:bg-purple-500'}">${isEdit ? 'บันทึกการแก้ไข' : 'เพิ่มบัญชีใหม่'}</button></div>
                        </form>
                        ` : `<div class="mb-6 p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-500 text-sm font-bold">คุณต้องเป็น 'ผู้ดูแลระบบ' เท่านั้นถึงจะเพิ่ม/แก้ไขผู้ใช้ได้</div>`}
                        <div class="overflow-x-auto rounded-xl border border-slate-500/10"><table class="w-full text-left min-w-[500px]"><thead class="text-xs text-secondary table-header"><tr><th class="p-4">Username</th><th class="p-4">Password</th><th class="p-4">Role</th><th class="p-4 text-right">Action</th></tr></thead><tbody>${userRows}</tbody></table></div>
                    </div>

                    <form onsubmit="saveDatabaseSettings(event)" class="bg-panel border p-6 md:p-8 rounded-[2rem] space-y-4 shadow-xl">
                        <h3 class="text-xl font-black text-primary flex items-center"><i data-lucide="cloud-lightning" class="w-5 h-5 mr-3 text-indigo-500"></i> การเชื่อมต่อฐานข้อมูล (Database)</h3>
                        <div class="pt-2"><label class="block font-bold text-sm text-secondary mb-2">URL ของ Google Apps Script</label><input type="url" id="setting-url" value="${state.gasUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-4 rounded-xl input-field border outline-none focus:border-indigo-500 font-medium text-sm"></div>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm px-6 py-3.5 rounded-xl transition">บันทึกการตั้งค่าซิงค์</button>
                    </form>

                    <div class="bg-panel border p-6 md:p-8 rounded-[2rem] shadow-xl">
                        <h3 class="text-xl font-black text-primary flex items-center mb-4"><i data-lucide="download-cloud" class="w-5 h-5 mr-3 text-emerald-500"></i> นำเข้า / ส่งออก ข้อมูล (Backup & Restore)</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="exportBackupJSON()" class="p-4 bg-white/5 border rounded-xl font-bold text-sm text-primary flex items-center justify-center hover-item"><i data-lucide="download" class="w-4 h-4 mr-2 text-blue-400"></i> ดาวน์โหลดไฟล์สำรอง (.json)</button>
                            <div class="relative"><input type="file" id="import-file" accept=".json" onchange="importBackupJSON(event)" class="hidden"><label htmlFor="import-file" onclick="document.getElementById('import-file').click()" class="p-4 bg-white/5 border border-dashed rounded-xl font-bold text-sm text-primary flex items-center justify-center hover-item cursor-pointer"><i data-lucide="upload" class="w-4 h-4 mr-2 text-purple-400"></i> กู้คืนระบบจากไฟล์ (.json)</label></div>
                        </div>
                    </div>
                </div>
                `;
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
